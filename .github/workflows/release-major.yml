name: Release major

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: release-major
    runs-on: macos-14
    timeout-minutes: 20
    environment: release-major
    steps:
      - name: Verify administrator permission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)"
          test "$permission" = "admin"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: Determine major version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          last_tag="$(git tag --merged HEAD --list 'v*' --sort=-v:refname | head -n 1)"
          if [[ -z "$last_tag" ]]; then
            echo "No existing release tag; publish v0.1.0 through the automatic workflow first." >&2
            exit 1
          fi
          IFS=. read -r major _ _ <<< "${last_tag#v}"
          echo "version=v$((major + 1)).0.0" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in arm64 amd64; do
            name="tidy-wow_${VERSION}_darwin_${arch}"
            GOOS=darwin GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/tidy-wow" ./cmd/tidy-wow
            tar -C dist -czf "dist/${name}.tar.gz" tidy-wow
          done
          shasum -a 256 dist/*.tar.gz > dist/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt --generate-notes --title "$VERSION"
